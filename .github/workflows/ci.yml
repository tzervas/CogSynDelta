name: CI/CD Pipeline

# Manual only — no push/pull_request CI triggers
on:
  push:
    branches:
      - main
      - dev
      - develop
  pull_request:
    branches:
      - main
      - dev
      - develop
  workflow_dispatch:

env:
  # Pin tool versions for consistency between local and CI
  RUFF_VERSION: "0.14.13"
  MYPY_VERSION: "1.19.1"
  UV_VERSION: "0.7.17"
  # Pre-download dependencies before any firewall/network restrictions
  UV_COMPILE_BYTECODE: "0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint & Format Check
    runs-on: [self-hosted, linux, x64, podman]
    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true

    # uvx: no project Python / torch. Same pins as local scripts/ci_local.sh.
    - name: Ruff lint check
      run: uvx ruff@${{ env.RUFF_VERSION }} check src/ tests/ benchmarks/ scripts/ examples/

    - name: Ruff format check
      run: uvx ruff@${{ env.RUFF_VERSION }} format --check src/ tests/ benchmarks/ scripts/ examples/

    - name: Type check with mypy
      run: >
        uvx --from mypy==${{ env.MYPY_VERSION }} --with types-PyYAML
        mypy src/

  pre-commit:
    name: Pre-commit Checks
    # Not a required merge check. The mypy hook pulls torch and starves the
    # homelab queue; ruff+mypy jobs already cover the same surface on PRs.
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, podman]
    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true

    - name: Run pre-commit on all files
      run: uvx pre-commit run --all-files

  quality:
    name: Quality Score Check
    runs-on: [self-hosted, linux, x64, podman]
    steps:
    - uses: actions/checkout@v6

    - name: Run quality checks (90+ required)
      # Stdlib only. Runner image already has python3.
      run: python3 scripts/quality_control.py src/ --fail-under 90

  test:
    name: Test on Python 3.12
    runs-on: [self-hosted, linux, x64, podman]
    timeout-minutes: 25

    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true

    - name: Set up Python 3.12
      run: uv python install 3.12

    - name: Install dependencies with CPU-only PyTorch
      run: |
        # Use --no-sources to bypass pyproject.toml torch source (cu128)
        # Use --index-strategy unsafe-best-match to allow packages from all indexes
        uv sync --group dev --no-sources --no-compile-bytecode --link-mode copy \
          --extra-index-url https://download.pytorch.org/whl/cpu \
          --index-strategy unsafe-best-match

    - name: Run tests with pytest
      run: |
        uv run --no-sync pytest tests/ -q --tb=short --cov=cogsyndelta --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
      continue-on-error: true

  # CodeQL removed - requires Code Scanning to be enabled in repo settings
  # Enable at: Settings > Security > Code scanning > Set up code scanning

  build:
    name: Build distribution
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, linux, x64, podman]
    needs: [test]

    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true

    - name: Set up Python 3.12
      run: uv python install 3.12

    - name: Build package
      run: uv build

    - name: Check package
      run: |
        uv tool install twine
        uv tool run twine check dist/*

    - name: Upload artifacts
      uses: actions/upload-artifact@v6
      with:
        name: dist
        path: dist/
