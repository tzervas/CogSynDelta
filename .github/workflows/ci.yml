name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  # Pin tool versions for consistency between local and CI
  RUFF_VERSION: "0.14.13"
  MYPY_VERSION: "1.19.1"
  UV_VERSION: "0.7.17"
  # Pre-download dependencies before any firewall/network restrictions
  UV_LINK_MODE: copy
  UV_COMPILE_BYTECODE: 1

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true

    - name: Set up Python 3.14
      run: uv python install 3.14

    - name: Install linting tools
      run: |
        uv tool install ruff@${{ env.RUFF_VERSION }}
        uv tool install mypy@${{ env.MYPY_VERSION }} --with types-PyYAML --with torch --with numpy

    # Individual tool runs for fine-grained fail-fast debugging
    - name: Ruff lint check
      run: uv tool run ruff check src/ tests/ benchmarks/ scripts/ examples/

    - name: Ruff format check
      run: uv tool run ruff format --check src/ tests/ benchmarks/ scripts/ examples/

    - name: Type check with mypy
      run: uv tool run mypy src/

  pre-commit:
    name: Pre-commit Checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true

    - name: Set up Python 3.14
      run: uv python install 3.14

    - name: Install pre-commit
      run: uv tool install pre-commit

    - name: Run pre-commit on all files
      run: uv tool run pre-commit run --all-files

  quality:
    name: Quality Score Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true

    - name: Set up Python 3.14
      run: uv python install 3.14

    - name: Run quality checks (90+ required)
      # Quality script uses only stdlib, no dependencies needed
      run: uv run --no-project python scripts/quality_control.py src/ --fail-under 90

  test:
    name: Test on Python 3.14
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
    - uses: actions/checkout@v6

    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/share/swift
        sudo rm -rf /usr/local/share/powershell
        sudo rm -rf /etc/apt/sources.list.d/*
        sudo apt-get clean
        docker image prune --all --force

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: false

    - name: Set up Python 3.14
      run: uv python install 3.14

    - name: Install dependencies with CPU-only PyTorch
      run: |
        # Use --no-sources to bypass pyproject.toml torch source (cu128)
        # Use --index-strategy unsafe-best-match to allow packages from all indexes
        uv sync --group dev --no-sources \
          --extra-index-url https://download.pytorch.org/whl/cpu \
          --index-strategy unsafe-best-match

    - name: Run tests with pytest
      run: |
        uv run pytest tests/ -v --cov=cogsyndelta --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
      continue-on-error: true

  # CodeQL removed - requires Code Scanning to be enabled in repo settings
  # Enable at: Settings > Security > Code scanning > Set up code scanning

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [test, quality]

    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true

    - name: Set up Python 3.14
      run: uv python install 3.14

    - name: Build package
      run: uv build

    - name: Check package
      run: |
        uv tool install twine
        uv tool run twine check dist/*

    - name: Upload artifacts
      uses: actions/upload-artifact@v6
      with:
        name: dist
        path: dist/
