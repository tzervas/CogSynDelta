# Fast PoC CI — contracts + poc only. Prefer while full suite is heavy.
# cancel-in-progress: false — a prior run was killed after 13m of real work
# when a later push landed. Self-hosted capacity is limited; finish started jobs.
#
# Runs on fleet gha-work image via [self-hosted, linux, x64, podman] labels.
# After CPU `uv sync --no-sources`, later `uv run` steps must use `--no-sync`
# so `[tool.uv.sources]` pytorch-cu128 does not re-resolve CUDA wheels.
# uv.lock pins CUDA torch; do not pass `--frozen` (it would install CUDA).
name: poc-ci

"on":
  push:
    branches: [main, develop, 'feat/poc-**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  # Keyed on github.ref, matching every other workflow here. The previous key,
  # `github.head_ref || github.ref_name`, collapsed the push and pull_request events for
  # a feature branch into ONE group: push falls back to ref_name and pull_request uses
  # head_ref, and on `feat/poc-x` both evaluate to `feat/poc-x`. With cancel-in-progress
  # on, whichever started second cancelled the first, and Forgejo reports a cancelled run
  # as `failure` -- so every push to a PR branch minted a permanently red
  # `poc-ci (push)` status that no code change could clear.
  # github.ref differs between the two (`refs/heads/...` vs `refs/pull/N/merge`), so they
  # get separate groups while superseded runs of the SAME event still cancel.
  group: poc-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  poc:
    name: PoC contracts + train + compress + route + train-route
    runs-on: [self-hosted, linux, x64, podman]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Verify uv (baked into job image)
        run: |
          # uv is baked into the job image (fleet-ci-base), so nothing is installed
          # here: no network dependency, and no tar extraction -- which is what forced
          # CAP_CHOWN into the job container. Assert rather than assume: a missing tool
          # must fail loudly and name the image, not silently skip the step.
          command -v uv >/dev/null 2>&1 || {
            echo "uv missing — job image is not fleet-ci-base" >&2; exit 1; }
          uv --version

      - name: Python + deps (CPU torch)
        run: |
          set -euo pipefail
          # Isolate from ~/.cache/uv — concurrent jobs racing torch wheel extract
          # fail with "No such file or directory" on libtorch_global_deps.so.
          export UV_CACHE_DIR="${RUNNER_TEMP:-/tmp}/uv-cache-${GITHUB_RUN_ID:-$$}"
          mkdir -p "$UV_CACHE_DIR"
          uv python install 3.12 || uv python install 3.13 || true
          uv sync --group dev --no-sources --no-compile-bytecode --link-mode copy \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match

      - name: Ruff (poc surface only)
        run: |
          uv run --no-sync ruff check src/cogsyndelta/contracts src/cogsyndelta/poc \
            tests/test_poc_contracts.py tests/test_poc_train.py \
            tests/test_poc_compress.py tests/test_poc_registry.py \
            tests/test_poc_route_train.py

      - name: Pytest PoC
        run: |
          uv run --no-sync pytest tests/test_poc_contracts.py tests/test_poc_train.py \
            tests/test_poc_compress.py tests/test_poc_registry.py \
            tests/test_poc_route_train.py -q --tb=short

      - name: CLI smoke
        run: |
          set -euo pipefail
          # --stream synthetic: the corpus is an NFS export from another host and this
          # runner has no mount. The flag is explicit because the default is real data;
          # the printed provenance marks the output as a code-path smoke, not a result.
          uv run --no-sync python -m cogsyndelta.poc.cli train --device cpu --steps 10 \
            --stream synthetic --checkpoint /tmp/poc_vae.pt
          uv run --no-sync python -m cogsyndelta.poc.cli compress --device cpu --batch 4 \
            --stream synthetic
          uv run --no-sync python -m cogsyndelta.poc.cli route --device cpu --batch 8
          uv run --no-sync python -m cogsyndelta.poc.cli train-route --device cpu --steps 10 \
            --stream synthetic
