[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cogsyndelta"
version = "0.1.0"
description = "PCN-VAE-GAN hybrid self-improving AI with VL-JEPA, mHC, quantum compute, and production-ready memory management"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "tzervas", email = "111450100+tzervas@users.noreply.github.com"}
]
keywords = [
    "machine-learning",
    "deep-learning",
    "pytorch",
    "vae",
    "gan",
    "predictive-coding",
    "self-improving-ai",
    "quantum-computing",
    "memory-management"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch==2.9.1",  # CUDA 12.6/12.8 support
    "torchvision==0.24.1",
    "numpy==2.4.1",
    "pyyaml==6.0.3",
    "fastapi==0.128.0",
    "uvicorn[standard]==0.40.0",
    "pydantic==2.12.5",
    "python-multipart==0.0.21",
    "websockets==16.0",
    "llama-index-core==0.14.12",
    "llama-index-embeddings-huggingface==0.14.12",
    "llama-index-vector-stores-faiss==0.14.12",
    "faiss-cpu==1.9.0.post1",
]

[project.optional-dependencies]
quantum = [
    "qiskit==2.3.0",
    "pennylane==0.44.0",
    "cirq==1.6.1",
]
vision = [
    "opencv-python==4.13.0.90",
    "mss>=10.0,<11.0",
    "pillow==12.1.0",
]
audio = [
    "pyaudio>=0.2.14,<1.0",
    "sounddevice>=0.5,<1.0",
]
dev = [
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
    "pytest-asyncio==1.3.0",
    "black==26.1.0",
    "ruff==0.14.13",
    "mypy==1.19.1",
    "pre-commit==4.5.1",
    "sphinx==9.1.0",
    "sphinx-rtd-theme==3.1.0",
]
all = [
    "cogsyndelta[quantum,vision,audio,dev]"
]

[project.urls]
Homepage = "https://github.com/tzervas/CogSynDelta"
Documentation = "https://github.com/tzervas/CogSynDelta/tree/main/docs"
Repository = "https://github.com/tzervas/CogSynDelta"
Issues = "https://github.com/tzervas/CogSynDelta/issues"

[project.scripts]
cogsyndelta-server = "cogsyndelta.api.server:main"
cogsyndelta-benchmark = "benchmarks.run:main"

[tool.setuptools]
packages = ["cogsyndelta"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
cogsyndelta = ["config/*.yaml", "config/*.json"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = false
warn_redundant_casts = true
warn_unused_ignores = true
strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
