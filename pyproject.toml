[build-system]
requires = ["setuptools>=68.0", "wheel>=0.42.0,<1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cogsyndelta"
version = "0.2.0"
description = "MoE-adjacent one-mind AI: cognitive regions + measured memory compression (PoC: LatentVAE)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = {text = "MIT"}
authors = [
    {name = "tzervas", email = "111450100+tzervas@users.noreply.github.com"}
]
keywords = [
    "machine-learning",
    "deep-learning",
    "pytorch",
    "vae",
    "mixture-of-experts",
    "cognitive-architecture",
    "memory-compression",
    "cuda",
    "gpu-acceleration"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.2.0,<3.0.0",
    "torchvision>=0.17.0,<1.0.0",
    "numpy>=1.26.0,<3.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "fastapi>=0.141.1,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "websockets>=12.0,<17.0",
    "httpx>=0.27.0,<1.0.0",
    "aiohttp>=3.14.3,<4.0.0",
]

[project.optional-dependencies]
vision = [
    "opencv-python>=4.10.0,<5.0.0",
    "mss>=10.0.0,<11.0.0",
    "pillow>=12.3.0,<13.0.0",
]
audio = [
    "pyaudio>=0.2.14,<1.0.0",
    "sounddevice>=0.5.0,<1.0.0",
]
gpu-nvidia = [
    "triton>=3.0.0,<4.0.0",
]
rag = [
    "llama-index-core>=0.14.0,<1.0.0",
    "llama-index-embeddings-huggingface>=0.6.0,<1.0.0",
    "llama-index-vector-stores-faiss>=0.5.0,<1.0.0",
    "faiss-cpu>=1.9.0,<2.0.0",
]
inference-providers = [
    "openai>=1.0.0,<3.0.0",
    "anthropic>=0.40.0,<1.0.0",
]
all = [
    "cogsyndelta[vision,audio,gpu-nvidia,rag,inference-providers]"
]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-cov>=5.0.0,<8.0.0",
    "pytest-asyncio>=0.23.0,<2.0.0",
    "ruff>=0.6.0,<0.15.0",
    "mypy>=1.8.0,<2.0.0",
    "types-PyYAML>=6.0.0,<7.0.0",
]
docs = [
    "sphinx>=7.0.0,<10.0.0",
    "sphinx-rtd-theme>=2.0.0,<4.0.0",
    "myst-parser>=3.0.0,<6.0.0",
]

[project.urls]
Homepage = "https://github.com/tzervas/CogSynDelta"
Documentation = "https://github.com/tzervas/CogSynDelta/tree/main/docs"
Repository = "https://github.com/tzervas/CogSynDelta"
Issues = "https://github.com/tzervas/CogSynDelta/issues"

[project.scripts]
cogsyndelta-server = "cogsyndelta.api.server:main"
cogsyndelta-benchmark = "benchmarks.run:main"
cogsyndelta-poc = "cogsyndelta.poc.cli:main"

[dependency-groups]
# Real training deps. Deliberately a separate group, not core: CI never trains, and
# pulling pyarrow + tokenizers into every lint job costs minutes for nothing. Training
# hosts run `uv sync --group train`.
#
#   pyarrow    the corpus on /mnt/fleet-datasets is 1654 parquet shards; without this
#              the repo cannot open a single one of them
#   tokenizers real BPE. The GPT-2 and Pythia tokenizer JSONs already sit on the export,
#              so this needs no download and no transformers dependency.
train = [
    "pyarrow>=18.0.0,<24.0.0",
    "tokenizers>=0.20.0,<1.0.0",
]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-cov>=5.0.0,<8.0.0",
    "pytest-asyncio>=0.23.0,<2.0.0",
    "ruff>=0.6.0,<0.15.0",
    "mypy>=1.8.0,<2.0.0",
    "types-PyYAML>=6.0.0,<7.0.0",
    "pre-commit>=4.6.2,<5.0.0",
    "yamllint>=1.38.0,<2.0.0",
]
docs = [
    "sphinx>=7.0.0,<10.0.0",
    "sphinx-rtd-theme>=2.0.0,<4.0.0",
    "myst-parser>=3.0.0,<6.0.0",
]

[tool.uv]
# CI runs `uv sync --no-sources`, which drops the [tool.uv.sources] cu128 pins and
# retargets torch/torchvision at the CPU index.
#
# The failure that motivates the line below, stated precisely (checked against the
# index listing, not inferred from the red X):
#   - torchvision 0.24.1 BARE publishes only macosx_11_0_arm64 and
#     manylinux_2_28_aarch64 wheels. There is no linux x86_64 wheel.
#   - torchvision 0.24.1+cpu DOES publish manylinux_2_28_x86_64.
# A lock entry for the bare version therefore installs fine on the cu128 index but
# becomes uninstallable the moment --no-sources retargets it at the CPU index on an
# x86_64 runner.
#
# required-environments forces resolution to prove a linux x86_64 wheel exists, so uv
# picks a version that actually has one. NOTE: it only takes effect when the lockfile
# is REGENERATED -- adding it without re-running `uv lock` leaves the stale bare-0.24.1
# entry in place and CI keeps failing with the same error.
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
add-bounds = "major"
python-preference = "managed"
python-downloads = "automatic"
link-mode = "hardlink"
compile-bytecode = false
default-groups = ["dev"]
cache-keys = [{ file = "pyproject.toml" }, { file = "uv.lock" }]
# Transitive floors for Trivy HIGH/CRITICAL on uv.lock. Each line is a CVE, not a
# preference -- raising a floor here is cheaper than pinning a direct dependency, and
# keeps the fix visible next to its reason.
#   pyasn1       via google-auth
#   starlette    via FastAPI
#   nltk         CVE-2026-79675 (CRITICAL, JVM options not validated) + CVE-2026-78680
#   transformers CVE-2026-9856  (HIGH, save_pretrained path traversal)
constraint-dependencies = [
    "pyasn1>=0.6.4",
    "starlette>=1.3.1",
    "nltk>=3.10.3",
    "transformers>=5.10.0",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Default source for desktop GPU installs; CI uses --no-sources + cpu index
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cogsyndelta = ["config/*.yaml", "config/*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py", "benchmarks/**/*.py"]
exclude = [".git", ".venv", "venv", "__pycache__", "*.egg-info", "build", "dist"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "S", "RET", "PTH", "PL", "RUF"]
ignore = [
    "E501", "S101", "S104", "S603", "PLR0913", "PLR2004", "PLR0912", "PLR0915",
    "RET504", "RUF001", "RUF002", "RUF003", "N812", "PLC0415", "UP008",
    "PTH123", "PTH118", "PTH103", "PTH207", "B007", "PLR1722",
    "RUF013", "RUF059", "N806", "N801", "B904", "B905", "B006",
    "S310", "S301", "SIM102", "SIM103", "SIM108", "SIM118",
    "PLW2901", "PLW0603", "RET503", "B028", "C414", "E722", "RUF005",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004"]
"scripts/**/*.py" = ["S603", "S607"]
"benchmarks/**/*.py" = ["F841"]
"examples/**/*.py" = ["F841"]

[tool.ruff.lint.isort]
known-first-party = ["cogsyndelta"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
warn_redundant_casts = true
warn_unused_ignores = false
strict_optional = false
ignore_missing_imports = true
no_implicit_optional = false
exclude = ["tests/", "benchmarks/", "examples/", "scripts/"]

[tool.pytest.ini_options]
markers = [
  "cpu: runs on CPU only; no GPU required",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

# Replaces python-semantic-release (2026-09-04): semantic-release's config lived in the
# now-removed [tool.semantic_release*] sections above and drove a GitHub-era release.yml
# that pushed to main directly and published to ghcr.io -- both wrong for this repo's
# Forgejo-native, PR-only workflow. commitizen enforces the same Conventional Commits
# format at commit-msg and pre-push time (.githooks/, .pre-commit-config.yaml) and drives
# the version bump + changelog from a PR, not a bot pushing main. major_version_zero
# keeps 0.x bumps on minor/patch (matches the current 0.2.0) until a deliberate 1.0.
[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
update_changelog_on_bump = true
changelog_incremental = true
annotated_tag = true
major_version_zero = true
version_files = ["src/cogsyndelta/__init__.py:__version__"]
