# Quadlet drop-in: host journald for CSD Loki labels.
# Install: /etc/containers/systemd/unifi-promtail.container.d/journald.conf
# Read-only journal. No docker.sock. No WAN ports.
# Do not GroupAdd=systemd-journal: promtail image has no such group (podman 126).
# Rootful quadlet can read host journal as container root.
[Container]
Volume=/var/log/journal:/var/log/journal:ro
Volume=/run/log/journal:/run/log/journal:ro
Volume=/etc/machine-id:/etc/machine-id:ro
