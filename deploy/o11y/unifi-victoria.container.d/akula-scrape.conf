# Quadlet drop-in: scrape Akula GPU exporters into VictoriaMetrics.
# Live install path remains /etc/akula/vm-scrape.yml (see deploy/o11y/vm-scrape.yml).
# Exec restates upstream flags (drop-in Exec replaces). Never WAN bind change.
[Container]
IP=172.30.0.12
Volume=/etc/akula/vm-scrape.yml:/vm-scrape.yml:ro
Exec=--storageDataPath=/victoria-metrics-data --retentionPeriod=365d --httpListenAddr=:8428 --promscrape.config=/vm-scrape.yml
