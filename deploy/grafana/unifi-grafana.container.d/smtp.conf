[Container]
# Send-only postfix on security-net gateway. No SMTP auth; mynetworks + allowlists.
# Quadlet Environment= splits on space; do not put spaces in FROM_NAME.
Environment=GF_SMTP_ENABLED=true
Environment=GF_SMTP_HOST=172.30.0.1:25
Environment=GF_SMTP_FROM_ADDRESS=grafana@vectorweight.com
Environment=GF_SMTP_FROM_NAME=CSD-Grafana
Environment=GF_SMTP_SKIP_VERIFY=true
Environment=GF_SMTP_EHLO_IDENTITY=grafana.vectorweight.com
