# VictoriaMetrics promscrape — existing Akula jobs plus CSD taxonomy labels.
# Install: /etc/akula/vm-scrape.yml (mounted read-only into unifi-victoria).
# LAN targets only. Never WAN. Never Tempo. Do not add jobs that are not live.
#
# Live jobs (VM label job/values, 2026-08-31): akula-health, akula-node.
# NVIDIA is akula_gpu_* on those jobs (health :9108 + nvidia-smi textfile),
# not a DCGM/nvidia_smi job. Alloy is not on homelab.
#
# host is taxonomy short form (prime|gpu5080). Keep existing role/gpu.
# gpu5080 is 192.168.1.251 (router static). Never .252 as current.
# Do not set path on akula-node: node_exporter already exports path= mountpoint.
#
# 1080 Ti RAG (group=akula-rag, ns=index, path=lab.gpu5080.index.1080ti):
# not a separate scrape target. nvidia-smi on gpu5080 is 5080-only
# (06:00.0 vfio-pci; no guest smi). metric_relabel stamps taxonomy if
# name matches 1080 Ti. Do not invent PromQL until those series exist.

global:
  scrape_interval: 15s
  scrape_timeout: 8s

scrape_configs:
  - job_name: akula-health
    metrics_path: /metrics
    static_configs:
      - targets: ["192.168.1.98:9108"]
        labels:
          host: prime
          role: prime
          gpu: rtx3090ti
          env: lab
          ns: csd
          service: akula-health-exporter
          kind: gpu
          group: csd-autodev
          path: lab.csd.gpu
      - targets: ["192.168.1.251:9108"]
        labels:
          host: gpu5080
          role: media
          gpu: rtx5080
          env: lab
          ns: csd
          service: akula-health-exporter
          kind: gpu
          group: csd-autodev
          path: lab.csd.gpu
    relabel_configs:
      - source_labels: [host]
        regex: akula-prime
        replacement: prime
        target_label: host
    metric_relabel_configs:
      # Fire only when exporter name is 1080 Ti. 5080 / 3090 series keep
      # static labels. RE2 (no (?i)). Observed nvidia-smi name would be
      # "NVIDIA GeForce GTX 1080 Ti" if the card binds.
      - source_labels: [name]
        regex: ".*1080[[:space:]]*Ti.*"
        target_label: gpu
        replacement: gtx1080ti
      - source_labels: [name]
        regex: ".*1080[[:space:]]*Ti.*"
        target_label: group
        replacement: akula-rag
      - source_labels: [name]
        regex: ".*1080[[:space:]]*Ti.*"
        target_label: ns
        replacement: index
      - source_labels: [name]
        regex: ".*1080[[:space:]]*Ti.*"
        target_label: kind
        replacement: gpu
      - source_labels: [name]
        regex: ".*1080[[:space:]]*Ti.*"
        target_label: path
        replacement: lab.gpu5080.index.1080ti
      - source_labels: [name]
        regex: ".*1080[[:space:]]*Ti.*"
        target_label: host
        replacement: gpu5080

  - job_name: akula-node
    metrics_path: /metrics
    static_configs:
      - targets: ["192.168.1.98:9100"]
        labels:
          host: prime
          role: prime
          env: lab
          ns: csd
          service: prometheus-node-exporter
          kind: api
          group: csd-autodev
      - targets: ["192.168.1.251:9100"]
        labels:
          host: gpu5080
          role: media
          env: lab
          ns: csd
          service: prometheus-node-exporter
          kind: api
          group: csd-autodev
    relabel_configs:
      - source_labels: [host]
        regex: akula-prime
        replacement: prime
        target_label: host
    # Taxonomy path omitted: colliding with node_filesystem path would drop
    # mountpoints and explode cardinality.
    # RAID live mount on gpu5080 is /bulk (md127 RAID0 both 3 TB, UUID
    # 8d85a4cc:d1690f1e:5b147e0f:767d6d3e). Do not invent a
    # node_filesystem PromQL panel for it here.

  # Live lab exporter on prime :9118 (csd-lab-console.service).
  # Gauges: csd_need_grok + csd_need_grok_mtime_seconds + scale ladder.
  # Do not poll hosted Grok. Do not add WAN targets.
  - job_name: csd-lab
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets: ["192.168.1.98:9118"]
        labels:
          host: prime
          role: prime
          env: lab
          ns: csd
          service: csd-lab-console
          kind: api
          group: csd-autodev
          path: lab.csd.ping
