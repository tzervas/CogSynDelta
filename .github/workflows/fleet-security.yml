# Fleet security lint/scan — self-hosted. Badge reflects honest job status on trunk.
# cancel-in-progress: false — do not kill started scans on rapid pushes.
# No continue-on-error / missing-tool skip. Homelab CPU already has trivy.
name: fleet-security

"on":
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

concurrency:
  group: fleet-security-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: [self-hosted, linux, x64, podman]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # The job container ships no gitleaks, docker or podman, so the previous
          # probe-and-exit-1 made this gate permanently red -- which trains people to
          # ignore it. Fetch the tool instead. Still fails closed: a download failure or
          # a finding both exit non-zero, so red continues to mean something.
          # Pinned on purpose; a floating security gate changes behaviour unreviewed.
          command -v gitleaks >/dev/null 2>&1 || {
            echo "gitleaks missing — job image is not fleet-ci-base" >&2; exit 1; }
          gitleaks version
          # Default detect walks every fetched ref. A docstring on an unmerged
          # branch then fails main and every open PR. PR runs scan only the
          # PR commits; push/schedule/dispatch scan HEAD's history only.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="${BASE_REF#refs/heads/}"
            [ -n "$BASE" ] || { echo "base ref empty on a pull_request event" >&2; exit 1; }
            git fetch --no-tags origin "+refs/heads/${BASE}:refs/remotes/origin/${BASE}"
            git rev-parse --verify -q "origin/${BASE}^{commit}" >/dev/null || {
              echo "origin/${BASE} did not resolve after fetch" >&2; exit 1; }
            gitleaks detect --source . --redact --verbose --log-opts="origin/${BASE}..HEAD"
          else
            gitleaks detect --source . --redact --verbose --log-opts=HEAD
          fi

  trivy-fs:
    name: trivy filesystem (vuln+secret+license)
    runs-on: [self-hosted, linux, x64, podman]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Trivy fs
        run: |
          set -euo pipefail
          # Same reasoning as the gitleaks gate above: fetch rather than be permanently
          # red. Fail-closed is preserved -- --exit-code 1 below still fails on findings.
          command -v trivy >/dev/null 2>&1 || {
            echo "trivy missing — job image is not fleet-ci-base" >&2; exit 1; }
          trivy --version
          trivy fs --scanners vuln,secret,license \
            --severity HIGH,CRITICAL \
            --skip-dirs .git --skip-dirs target --skip-dirs node_modules --skip-dirs .venv \
            --exit-code 1 \
            .
