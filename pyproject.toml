[build-system]
requires = ["setuptools>=68.0", "wheel>=0.42.0,<1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cogsyndelta"
version = "0.2.0"
description = "MoE-adjacent one-mind AI: cognitive regions + measured memory compression (PoC: LatentVAE)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = {text = "MIT"}
authors = [
    {name = "tzervas", email = "111450100+tzervas@users.noreply.github.com"}
]
keywords = [
    "machine-learning",
    "deep-learning",
    "pytorch",
    "vae",
    "mixture-of-experts",
    "cognitive-architecture",
    "memory-compression",
    "cuda",
    "gpu-acceleration"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.2.0,<3.0.0",
    "torchvision>=0.17.0,<1.0.0",
    "numpy>=1.26.0,<3.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "fastapi>=0.141.1,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "websockets>=12.0,<17.0",
    "httpx>=0.27.0,<1.0.0",
    "aiohttp>=3.14.3,<4.0.0",
]

[project.optional-dependencies]
vision = [
    "opencv-python>=4.10.0,<5.0.0",
    "mss>=10.0.0,<11.0.0",
    "pillow>=12.3.0,<13.0.0",
]
audio = [
    "pyaudio>=0.2.14,<1.0.0",
    "sounddevice>=0.5.0,<1.0.0",
]
gpu-nvidia = [
    "triton>=3.0.0,<4.0.0",
]
rag = [
    "llama-index-core>=0.14.0,<1.0.0",
    "llama-index-embeddings-huggingface>=0.6.0,<1.0.0",
    "llama-index-vector-stores-faiss>=0.5.0,<1.0.0",
    "faiss-cpu>=1.9.0,<2.0.0",
]
inference-providers = [
    "openai>=1.0.0,<3.0.0",
    "anthropic>=0.40.0,<1.0.0",
]
all = [
    "cogsyndelta[vision,audio,gpu-nvidia,rag,inference-providers]"
]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-cov>=5.0.0,<8.0.0",
    "pytest-asyncio>=0.23.0,<2.0.0",
    "ruff>=0.6.0,<0.15.0",
    "mypy>=1.8.0,<2.0.0",
    "types-PyYAML>=6.0.0,<7.0.0",
]
docs = [
    "sphinx>=7.0.0,<10.0.0",
    "sphinx-rtd-theme>=2.0.0,<4.0.0",
    "myst-parser>=3.0.0,<6.0.0",
]

[project.urls]
Homepage = "https://github.com/tzervas/CogSynDelta"
Documentation = "https://github.com/tzervas/CogSynDelta/tree/main/docs"
Repository = "https://github.com/tzervas/CogSynDelta"
Issues = "https://github.com/tzervas/CogSynDelta/issues"

[project.scripts]
cogsyndelta-server = "cogsyndelta.api.server:main"
cogsyndelta-benchmark = "benchmarks.run:main"
cogsyndelta-poc = "cogsyndelta.poc.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-cov>=5.0.0,<8.0.0",
    "pytest-asyncio>=0.23.0,<2.0.0",
    "ruff>=0.6.0,<0.15.0",
    "mypy>=1.8.0,<2.0.0",
    "types-PyYAML>=6.0.0,<7.0.0",
]
docs = [
    "sphinx>=7.0.0,<10.0.0",
    "sphinx-rtd-theme>=2.0.0,<4.0.0",
    "myst-parser>=3.0.0,<6.0.0",
]

[tool.uv]
# CI runs `uv sync --no-sources`, which drops the [tool.uv.sources] cu128 pins and
# resolves torch/torchvision off the CPU index. With only an upper bound that selected
# torchvision 0.24.1, which publishes win_arm64 wheels ONLY - so every linux x86_64 job
# failed at install. Requiring the target platform makes uv resolve to a version that
# actually has a linux x86_64 wheel.
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
add-bounds = "major"
python-preference = "managed"
python-downloads = "automatic"
link-mode = "hardlink"
compile-bytecode = false
default-groups = ["dev"]
cache-keys = [{ file = "pyproject.toml" }, { file = "uv.lock" }]
# Transitive floors for Trivy HIGH on uv.lock (pyasn1 via google-auth; starlette via FastAPI).
constraint-dependencies = [
    "pyasn1>=0.6.4",
    "starlette>=1.3.1",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Default source for desktop GPU installs; CI uses --no-sources + cpu index
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cogsyndelta = ["config/*.yaml", "config/*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py", "benchmarks/**/*.py"]
exclude = [".git", ".venv", "venv", "__pycache__", "*.egg-info", "build", "dist"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "S", "RET", "PTH", "PL", "RUF"]
ignore = [
    "E501", "S101", "S104", "S603", "PLR0913", "PLR2004", "PLR0912", "PLR0915",
    "RET504", "RUF001", "RUF002", "RUF003", "N812", "PLC0415", "UP008",
    "PTH123", "PTH118", "PTH103", "PTH207", "B007", "PLR1722",
    "RUF013", "RUF059", "N806", "N801", "B904", "B905", "B006",
    "S310", "S301", "SIM102", "SIM103", "SIM108", "SIM118",
    "PLW2901", "PLW0603", "RET503", "B028", "C414", "E722", "RUF005",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004"]
"scripts/**/*.py" = ["S603", "S607"]
"benchmarks/**/*.py" = ["F841"]
"examples/**/*.py" = ["F841"]

[tool.ruff.lint.isort]
known-first-party = ["cogsyndelta"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
warn_redundant_casts = true
warn_unused_ignores = false
strict_optional = false
ignore_missing_imports = true
no_implicit_optional = false
exclude = ["tests/", "benchmarks/", "examples/", "scripts/"]

[tool.pytest.ini_options]
markers = [
  "cpu: runs on CPU only; no GPU required",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.semantic_release]
version_variables = ["src/cogsyndelta/__init__.py:__version__"]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
build_command = "uv build"
upload_to_pypi = false
upload_to_release = true
commit_message = "chore(release): {version} [skip ci]"
tag_format = "v{version}"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.develop]
match = "develop"
prerelease = true
prerelease_token = "dev"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "docs", "style", "refactor", "perf", "test", "build", "ci", "chore"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"
