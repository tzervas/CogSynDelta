# Fast PoC CI — contracts + poc only. Prefer while full suite is heavy.
# cancel-in-progress: false — a prior run was killed after 13m of real work
# when a later push landed. Self-hosted capacity is limited; finish started jobs.
#
# TEMPORARY: runs-on ubuntu-latest while self-hosted runners are offline / not
# consuming. Restore to [self-hosted, linux, x64, podman] when home-lab is up.
name: poc-ci

on:
  push:
    branches: [main, develop, 'feat/poc-**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: poc-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poc:
    name: PoC contracts + train + compress
    runs-on: ubuntu-latest
    # restore when home-lab online: runs-on: [self-hosted, linux, x64, podman]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Python + deps (CPU torch)
        run: |
          set -euo pipefail
          uv python install 3.12 || uv python install 3.13 || true
          uv sync --group dev --no-sources \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match

      - name: Ruff (poc surface only)
        run: |
          uv run ruff check src/cogsyndelta/contracts src/cogsyndelta/poc \
            tests/test_poc_contracts.py tests/test_poc_train.py tests/test_poc_compress.py

      - name: Pytest PoC
        run: |
          uv run pytest tests/test_poc_contracts.py tests/test_poc_train.py tests/test_poc_compress.py -q --tb=short

      - name: CLI smoke
        run: |
          set -euo pipefail
          uv run python -m cogsyndelta.poc.cli train --device cpu --steps 10 --checkpoint /tmp/poc_vae.pt
          uv run python -m cogsyndelta.poc.cli compress --device cpu --batch 4
