[build-system]
requires = ["setuptools>=68.0,<69.0", "wheel>=0.42.0,<1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cogsyndelta"
version = "0.1.0"
description = "PCN-VAE-GAN hybrid self-improving AI with VL-JEPA, mHC, quantum compute, and production-ready memory management"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
    {name = "tzervas", email = "111450100+tzervas@users.noreply.github.com"}
]
keywords = [
    "machine-learning",
    "deep-learning",
    "pytorch",
    "vae",
    "gan",
    "predictive-coding",
    "self-improving-ai",
    "quantum-computing",
    "memory-management",
    "cuda",
    "gpu-acceleration"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.9.0,<3.0.0",
    "torchvision>=0.24.0,<1.0.0",
    "numpy>=2.4.0,<3.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "fastapi>=0.128.0,<1.0.0",
    "uvicorn[standard]>=0.40.0,<1.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "python-multipart>=0.0.21,<1.0.0",
    "websockets>=16.0,<17.0",
    "llama-index-core>=0.14.0,<1.0.0",
    "llama-index-embeddings-huggingface>=0.6.0,<1.0.0",
    "llama-index-vector-stores-faiss>=0.5.0,<1.0.0",
    "faiss-cpu>=1.9.0,<2.0.0",
    "httpx>=0.28.0,<1.0.0",
    "aiohttp>=3.11.0,<4.0.0",
]

[project.optional-dependencies]
# NOTE: Quantum packages (qiskit, pennylane, cirq) not compatible with Python 3.14 yet
# Install manually with Python 3.13 or earlier if needed
vision = [
    "opencv-python>=4.10.0,<5.0.0",
    "mss>=10.0.0,<11.0.0",
    "pillow>=11.0.0,<13.0.0",
]
audio = [
    "pyaudio>=0.2.14,<1.0.0",
    "sounddevice>=0.5.0,<1.0.0",
]
gpu-nvidia = [
    "triton>=3.3.0,<4.0.0",
]
inference-providers = [
    "openai>=2.15.0,<3.0.0",
    "anthropic>=0.76.0,<1.0.0",
    "google-cloud-aiplatform>=1.86.0,<2.0.0",
    "replicate>=1.0.0,<2.0.0",
    "together>=1.5.0,<2.0.0",
    "groq>=1.0.0,<2.0.0",
]
all = [
    "cogsyndelta[vision,audio,gpu-nvidia,inference-providers]"
]
# Dev dependencies for pip install -e ".[dev]" compatibility
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-xdist>=3.8.0,<4.0.0",
    "ruff>=0.14.13,<0.15.0",
    "mypy>=1.19.0,<2.0.0",
    "pre-commit>=4.5.0,<5.0.0",
    "types-PyYAML>=6.0.0,<7.0.0",
]
docs = [
    "sphinx>=9.0.0,<10.0.0",
    "sphinx-rtd-theme>=3.1.0,<4.0.0",
    "myst-parser>=5.0.0,<6.0.0",
]

[project.urls]
Homepage = "https://github.com/tzervas/CogSynDelta"
Documentation = "https://github.com/tzervas/CogSynDelta/tree/main/docs"
Repository = "https://github.com/tzervas/CogSynDelta"
Issues = "https://github.com/tzervas/CogSynDelta/issues"

[project.scripts]
cogsyndelta-server = "cogsyndelta.api.server:main"
cogsyndelta-benchmark = "benchmarks.run:main"

[dependency-groups]
# For uv sync --group dev
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-xdist>=3.8.0,<4.0.0",
    "ruff>=0.14.13,<0.15.0",
    "mypy>=1.19.0,<2.0.0",
    "pre-commit>=4.5.0,<5.0.0",
    "types-PyYAML>=6.0.0,<7.0.0",
]
docs = [
    "sphinx>=9.0.0,<10.0.0",
    "sphinx-rtd-theme>=3.1.0,<4.0.0",
    "myst-parser>=5.0.0,<6.0.0",
]

[tool.uv]
add-bounds = "major"
python-preference = "managed"
python-downloads = "automatic"
link-mode = "hardlink"
compile-bytecode = true
default-groups = ["dev"]
cache-keys = [{ file = "pyproject.toml" }, { file = "uv.lock" }]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm63"
url = "https://download.pytorch.org/whl/rocm6.3"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.setuptools]
packages = ["cogsyndelta"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
cogsyndelta = ["config/*.yaml", "config/*.json"]

[tool.ruff]
line-length = 100
target-version = "py314"

# Include src and tests directories
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py", "benchmarks/**/*.py"]
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "*.egg-info",
    "build",
    "dist",
]

[tool.ruff.format]
# Use ruff format instead of black
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
# Balanced rule set: high quality without being pedantic
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "W",      # pycodestyle warnings
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "S",      # flake8-bandit (security)
    "RET",    # flake8-return
    "PTH",    # flake8-use-pathlib
    "PL",     # pylint subset
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "S101",   # assert usage (fine in tests and early dev)
    "S104",   # binding to all interfaces (needed for servers)
    "S603",   # subprocess without shell=True check
    "PLR0913", # too many arguments (too pedantic for early dev)
    "PLR2004", # magic value comparison (too pedantic)
    "PLR0912", # too many branches (complexity handled by quality script)
    "PLR0915", # too many statements (complexity handled by quality script)
    "RET504", # unnecessary assignment before return (sometimes clearer)
    "RUF001", # ambiguous unicode in string (intentional math symbols)
    "RUF002", # ambiguous unicode in docstring (intentional math symbols)
    "RUF003", # ambiguous unicode in comment (intentional math symbols)
    "N812",   # lowercase imported as non-lowercase (F is common for functional)
    "PLC0415", # import outside top-level (sometimes needed for optional deps)
    "UP008",  # super-call-with-parameters (explicit can be clearer)
    "PTH123", # builtin-open (pathlib open not always better)
    "PTH118", # os-path-join (pathlib not always better for simple cases)
    "PTH103", # os-makedirs (pathlib not always better)
    "PTH207", # glob (pathlib glob not always better)
    "B007",   # unused loop control variable (underscore convention handled)
    "PLR1722", # sys.exit vs exit (minor)
    # Early development relaxations - tighten later
    "RUF013", # implicit Optional (common in early dev)
    "RUF059", # unused unpacked variable (often used for destructuring)
    "N806",   # variable name should be lowercase (tensor dims are often uppercase)
    "N801",   # class name should use CapWords (mHC is intentional naming)
    "B904",   # raise without from (minor - can add later)
    "B905",   # zip without strict (minor - can add later)
    "B006",   # mutable default argument (valid issue but common pattern)
    "S310",   # suspicious URL open (needed for fetching docs)
    "S301",   # pickle security (internal use only)
    "SIM102", # nested if (sometimes more readable)
    "SIM103", # needless bool (sometimes clearer)
    "SIM108", # ternary (sometimes if-else is clearer)
    "SIM118", # dict.keys() (sometimes clearer)
    "PLW2901", # loop variable overwritten (common pattern for processing)
    "PLW0603", # global statement (sometimes needed)
    "RET503", # missing explicit return (sometimes cleaner)
    "B028",   # no explicit stacklevel (minor)
    "C414",   # unnecessary list in sorted (minor)
    "E722",   # bare except (sometimes needed)
    "RUF005", # collection literal concat (minor style)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004"]  # Allow asserts and magic values in tests
"scripts/**/*.py" = ["S603", "S607"]   # Allow subprocess in scripts
"benchmarks/**/*.py" = ["F841"]        # Allow unused variables in benchmarks (timing loops)
"examples/**/*.py" = ["F841"]          # Allow unused variables in examples (demos)

[tool.ruff.lint.isort]
known-first-party = ["cogsyndelta"]

[tool.mypy]
python_version = "3.14"
warn_return_any = false  # Relaxed for early development
warn_unused_configs = true
disallow_untyped_defs = false  # Relaxed for early development
check_untyped_defs = false  # Relaxed for early development
disallow_incomplete_defs = false  # Relaxed for early development
disallow_untyped_calls = false
warn_redundant_casts = true
warn_unused_ignores = false  # Relaxed - ignores may be version-specific
strict_optional = false  # Relaxed for early development
ignore_missing_imports = true  # Many deps may lack stubs
no_implicit_optional = false  # Allow implicit Optional for early dev

# Exclude problematic paths from mypy checking
exclude = [
    "tests/",
    "benchmarks/",
    "examples/",
    "scripts/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
