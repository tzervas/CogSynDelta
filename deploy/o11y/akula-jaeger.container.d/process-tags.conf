# Quadlet drop-in: Jaeger process tags = taxonomy host+env+ns.
# Install: /etc/containers/systemd/akula-jaeger.container.d/process-tags.conf
# Live unit is akula-jaeger (not unifi-jaeger). UI stays 127.0.0.1:16686.
# Never Tempo. Never PublishPort 0.0.0.0.
[Container]
Environment=JAEGER_TAGS=host=homelab,env=prod-intent,ns=o11y
Environment=OTEL_RESOURCE_ATTRIBUTES=host=homelab,env=prod-intent,ns=o11y,service.name=akula-jaeger
