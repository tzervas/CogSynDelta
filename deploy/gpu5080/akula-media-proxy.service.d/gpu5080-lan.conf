# Homelab ingress-net 172.32.0.1:8188 → gpu5080 LAN Comfy.
# OWUI IMAGE_GENERATION_ENGINE=comfyui keeps COMFYUI_BASE_URL here.
# Do not restart Open WebUI. Restart this proxy only.
# Host IP is 192.168.1.251 (never .252). Never 0.0.0.0 WAN.

[Unit]
Description=Akula media proxy (ingress-net 172.32.0.1:8188 → gpu5080 192.168.1.251:8188)

[Service]
ExecStart=
ExecStart=/usr/bin/socat TCP-LISTEN:8188,bind=172.32.0.1,reuseaddr,fork TCP:192.168.1.251:8188
