# Fast PoC CI — contracts + poc only. Prefer while full suite is heavy.
# cancel-in-progress: false — a prior run was killed after 13m of real work
# when a later push landed. Self-hosted capacity is limited; finish started jobs.
#
# Runs on fleet gha-work image via [self-hosted, linux, x64, podman] labels.
# After CPU `uv sync --no-sources`, later `uv run` steps must use `--no-sync`
# so `[tool.uv.sources]` pytorch-cu128 does not re-resolve CUDA wheels.
# uv.lock pins CUDA torch; do not pass `--frozen` (it would install CUDA).
name: poc-ci

on:
  push:
    branches: [main, develop, 'feat/poc-**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: poc-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  poc:
    name: PoC contracts + train + compress + route + train-route
    runs-on: [self-hosted, linux, x64, podman]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        run: |
          # setup-uv@v7 as mirrored on data.forgejo.org fails to unpack uv
          # ("tar failed with exit code 2") from both its mirror and the GitHub
          # fallback, so uv never lands on PATH. The installer is one call to a
          # host CI already reaches, and honours the same UV_VERSION pin.
          VER="${{ env.UV_VERSION }}"
          if [ -n "$VER" ]; then
            curl -LsSf "https://astral.sh/uv/${VER}/install.sh" | sh
          else
            curl -LsSf https://astral.sh/uv/install.sh | sh
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Python + deps (CPU torch)
        run: |
          set -euo pipefail
          # Isolate from ~/.cache/uv — concurrent jobs racing torch wheel extract
          # fail with "No such file or directory" on libtorch_global_deps.so.
          export UV_CACHE_DIR="${RUNNER_TEMP:-/tmp}/uv-cache-${GITHUB_RUN_ID:-$$}"
          mkdir -p "$UV_CACHE_DIR"
          uv python install 3.12 || uv python install 3.13 || true
          uv sync --group dev --no-sources --no-compile-bytecode --link-mode copy \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match

      - name: Ruff (poc surface only)
        run: |
          uv run --no-sync ruff check src/cogsyndelta/contracts src/cogsyndelta/poc \
            tests/test_poc_contracts.py tests/test_poc_train.py \
            tests/test_poc_compress.py tests/test_poc_registry.py \
            tests/test_poc_route_train.py

      - name: Pytest PoC
        run: |
          uv run --no-sync pytest tests/test_poc_contracts.py tests/test_poc_train.py \
            tests/test_poc_compress.py tests/test_poc_registry.py \
            tests/test_poc_route_train.py -q --tb=short

      - name: CLI smoke
        run: |
          set -euo pipefail
          uv run --no-sync python -m cogsyndelta.poc.cli train --device cpu --steps 10 --checkpoint /tmp/poc_vae.pt
          uv run --no-sync python -m cogsyndelta.poc.cli compress --device cpu --batch 4
          uv run --no-sync python -m cogsyndelta.poc.cli route --device cpu --batch 8
          uv run --no-sync python -m cogsyndelta.poc.cli train-route --device cpu --steps 10
