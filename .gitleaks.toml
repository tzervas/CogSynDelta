title = "CogSynDelta gitleaks config"

[extend]
# Keep every default rule; we only add narrow allowlist entries below.
useDefault = true

# fleet-security / gitleaks runs `gitleaks detect --source . --verbose --redact`
# (.github/workflows/fleet-security.yml) with no --no-git flag, i.e. full
# git-history mode: every commit ever reachable from HEAD is scanned every
# run, forever. That makes a per-commit fix-forward ineffective for this
# false positive, and a .gitleaksignore fingerprint entry unstable for it:
#
#   - The underlying secret-shaped text is a tokenizer-load log line,
#     committed verbatim as byte-for-byte experiment evidence in
#     docs/design/evidence/w1-token-rank-2026-09-02/results.json:350 and
#     w1d-readout-probe-2026-09-02/results.json:590 (PR #5, introduced at
#     commit 27b0e4d). .gitleaksignore already carries fingerprint entries
#     for those two, scoped to 27b0e4d.
#   - .gitleaksignore itself is a committed, git-history-scanned file. An
#     earlier commit (6f8ff7b) quoted that same log line verbatim in a
#     documentation comment, which made the "generic-api-key" rule match
#     .gitleaksignore's own historical content (commit 6f8ff7b, lines 19
#     and 22). That commit is immutable -- rewriting it is out of scope --
#     so no fingerprint entry keyed to the *current* file state can ever
#     suppress a match against that specific past blob, and a fingerprint
#     entry keyed to 6f8ff7b would itself be displaced the next time this
#     file's line numbers shift, reopening the same failure.
#
# The allowlist below matches only the byte-identical substring under only
# the one rule it false-positives on, so it cannot mask an unrelated
# secret, and it covers the finding regardless of which commit or file it
# is quoted in -- including .gitleaksignore's own history.
[[allowlists]]
description = "generic-api-key false positive: tokenizer-load log line (evidence files + quoted in .gitleaksignore's own history at 6f8ff7b)"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = [
  '''gpt2_tokenizer\.json, vocab_size=50257''',
]

# fleet-security / gitleaks (PR #7, head 4d2d886) failed on one finding:
#
#   File:   src/cogsyndelta/regions/memory.py:175
#   Commit: 6df1a68d34c65235f536b86983192cde29453265
#   RuleID: generic-api-key
#
# The flagged text is a key=value-shaped substring inside prose --
# `EVIDENCE_50_STEP_CONTROL_ARM`'s docstring reads: "...attributable to
# token_loss_weight alone (control->token_only, decorr_weight=0.0
# throughout that step)...", where `decorr_weight=0.0` is one of the three
# control-arm loss weights the surrounding sentence is reporting (see
# docs/design/evidence/w4-control-arm-2026-09-03/README.md), not a
# credential. Same class of false positive as the tokenizer-load line
# above: a low-entropy identifier=value pair the generic-api-key rule
# can't distinguish from a real key. Entropy measured 3.73.
#
# Scoped narrower than the entry above on purpose, since this one is a
# single source file rather than an evidence directory: `condition = "AND"`
# requires BOTH the path AND the exact phrase to match, so this cannot
# swallow an unrelated secret elsewhere in memory.py, and the regex is the
# byte-identical phrase from the docstring, not a bare `decorr_weight=`
# that could match a differently-valued (and potentially real) pair later.
[[allowlists]]
description = "generic-api-key false positive: decorr_weight=0.0 in EVIDENCE_50_STEP_CONTROL_ARM's docstring (src/cogsyndelta/regions/memory.py:175, commit 6df1a68d)"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
paths = [
  '''^src/cogsyndelta/regions/memory\.py$''',
]
regexes = [
  '''token_only, decorr_weight=0\.0''',
]

# tests/test_cards_tables.py builds MetricRow(...) fixtures whose keyword argument is literally
# named `key` (a metric name such as eff.latency_p50_ms). generic-api-key matches the
# key-equals-quoted-token shape on every commit that carries such a line, including history, so the
# file is allowlisted by path; it holds metric names and numbers, never credentials.
[[allowlists]]
description = "metric-table test fixtures: MetricRow(key=...) is a metric name, not a key"
paths = [
  '''tests/test_cards_tables\.py$''',
]

# fleet-security / gitleaks flagged one finding on branch feat/lexical-baseline:
#
#   File:        src/cogsyndelta/eval/lexical.py:116
#   Commit:      b628e00b15b87301d0dd5f8701b66bf83168c5e5
#   RuleID:      generic-api-key
#   Fingerprint: b628e00b15b87301d0dd5f8701b66bf83168c5e5:src/cogsyndelta/eval/lexical.py:generic-api-key:116
#
# The flagged text is the module's own docstring:
# `"""Log-tf x smoothed-idf vector for one tokenised document, L2-normalised."""`
# -- a metric description, not a credential. "tokenised" contains the substring
# "token" (one of generic-api-key's keywords), and the comma before
# "L2-normalised" reads as a key/value separator, making "L2-normalised" look
# like the secret value. Because fleet-security scans every ref on a
# fetch-depth-0 checkout (gitleaks detect --source . --verbose --redact), this
# false positive would turn every branch -- including main -- red, not just
# this one.
#
# Same class of false positive as the two entries above, scoped the same way:
# `condition = "AND"` requires BOTH the path AND the exact phrase to match, so
# this cannot swallow an unrelated secret elsewhere in lexical.py -- a
# path-only allowlist would.
[[allowlists]]
description = "generic-api-key false positive: docstring reads as key/value across the comma in \"...one tokenised document, L2-normalised.\" (src/cogsyndelta/eval/lexical.py:116, commit b628e00b)"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
paths = [
  '''^src/cogsyndelta/eval/lexical\.py$''',
]
regexes = [
  '''tokenised document, L2-normalised''',
]
