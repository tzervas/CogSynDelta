# CogSynDelta Pre-commit Configuration
# See docs/DEVELOPMENT_STANDARDS.md for details

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--allow-multiple-documents']
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-toml
      - id: check-json
        exclude: \.ipynb$
      - id: check-case-conflict
      - id: check-ast
      - id: debug-statements
      - id: mixed-line-ending

  # Conventional Commits - commit message validation
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, --force-scope]

  # Ruff - unified linting and formatting (replaces black, isort, flake8)
  # Runs over every tracked *.py in the repo (report only -- no --fix in the hook;
  # a lint gate that rewrites files instead of failing on them isn't a gate).
  # The one carve-out is docs/design/evidence/: one-off measurement scripts that
  # already produced published experimental results (see the CSD program docs and
  # KB entries for W1/W1d/W2c). `ruff check` on them surfaces real findings --
  # B023 loop-variable-closure bugs, subprocess argument-safety flags -- that are
  # not safe to fix mechanically without risking the recorded numbers; that
  # directory needs a deliberate pass, not a lint-gate sweep. Everything else
  # previously excluded here (deploy/, config/, setup.py, libs/algebraic-training/)
  # is maintained code and is included and clean.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13
    hooks:
      - id: ruff
        args: [--exit-non-zero-on-fix]
        files: \.py$
        exclude: ^docs/design/evidence/
      - id: ruff-format
        files: \.py$
        exclude: ^docs/design/evidence/

  # Mypy - type checking
  # LOCAL hook, not mirrors-mypy: mirrors-mypy runs mypy in an isolated venv
  # seeded only by `additional_dependencies`, which cannot see the project's
  # actual dependencies (openai, anthropic, llama-index, faiss, pyarrow,
  # tokenizers, pytest, ...) and silently misses every type error that depends
  # on one of them. `uv run mypy` runs the repo's own mypy, installed via the
  # `dev` dependency group into the project's uv-managed venv, so it resolves
  # real dependency types and picks up [tool.mypy] in pyproject.toml
  # (ignore_missing_imports, strict_optional, exclude, ...) instead of
  # duplicating those settings as hook args.
  #
  # Runs over every tracked *.py except: tests/benchmarks/examples/scripts at repo
  # root (ci.yml's required "Type check with mypy" step runs `mypy src/` alone and
  # docs/DEVELOPMENT_STANDARDS.md's Quick Reference agrees -- this hook is a
  # superset of that authoritative check, not a replacement for it, so the parts
  # CI doesn't hold to a typing bar stay out here too) and docs/design/evidence/
  # (see the ruff hook's comment above -- same one-off-scripts risk, worse: 22 of
  # its mypy findings are a dynamically-loaded-class pattern that would need a
  # real redesign, not a mechanical fix). deploy/, config/, setup.py and
  # libs/algebraic-training/ are included and clean.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (uv run, project venv)
        entry: uv run mypy
        language: system
        types: [python]
        files: \.py$
        exclude: ^(tests/|benchmarks/|examples/|scripts/|docs/design/evidence/)
        require_serial: true

  # Pydocstyle - Google style docstring enforcement
  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        # D100: Missing docstring in public module
        # D104: Missing docstring in public package
        # D105: Missing docstring in magic method
        # D107: Missing docstring in __init__
        # D103: Missing docstring in public function (allow for demos/tests)
        # D200: One-line docstring fits on one line (minor style)
        # D202: No blank lines after function docstring
        # D205: 1 blank line between summary and description (conflicts)
        # D212: Multi-line summary at first line (conflicts with D213)
        # D403: First word should be capitalized (too pedantic)
        # D415: First line should end with punctuation (too pedantic)
        args: [--convention=google, "--add-ignore=D100,D103,D104,D105,D107,D200,D202,D205,D212,D403,D415"]
        files: ^src/
        exclude: ^src/cogsyndelta/__init__.py$

  # Shellcheck - shell script linting (matches *.sh and any file with a bash/sh shebang)
  # severity=info, not warning: SC2086 (unquoted expansion) and most of the checks
  # this gate exists to catch are shellcheck's "info" level. severity=warning let
  # every info-level finding through silently -- verified with a constructed
  # `echo $1` probe (flagged at info, invisible at warning). style level (the
  # shellcheck default) is left out: it's naggy formatting preference, not bugs.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=info]

  # yamllint - YAML style/lint, config in .yamllint.yaml. truthy is pinned to
  # level: error there (not --strict here): --strict would also promote
  # line-length, deliberately kept advisory-only at level: warning, into a
  # blocking finding across every over-120-char line in the repo, which isn't
  # what that rule is for.
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
