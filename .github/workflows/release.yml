# Release Workflow for CogSynDelta
# Triggers on merge to main, creates releases with semantic versioning
# Builds artifacts but does NOT publish to PyPI (requires explicit approval)

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual release)'
        required: false
        default: false
        type: boolean

# Prevent concurrent releases
concurrency:
  group: release
  cancel-in-progress: false

env:
  UV_VERSION: "0.7.17"

jobs:
  # Check if release is needed (skip for docs-only changes)
  check-release:
    name: Check if Release Needed
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for code changes since last tag
        id: check
        run: |
          # Get last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LAST_TAG" ]; then
            echo "No previous tag found, should release"
            echo "should_release=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if there are code changes (not just docs)
          CODE_CHANGES=$(git diff --name-only $LAST_TAG HEAD -- \
            'src/**' \
            'benchmarks/**' \
            'tests/**' \
            'pyproject.toml' \
            'requirements*.txt' \
            | wc -l)

          if [ "$CODE_CHANGES" -gt 0 ]; then
            echo "Code changes detected: $CODE_CHANGES files"
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "No code changes since $LAST_TAG, skipping release"
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests before release
        run: uv run pytest tests/ -v

      - name: Install semantic-release
        run: uv tool install python-semantic-release

      - name: Determine version
        id: version
        run: |
          # Get next version from semantic-release
          NEXT_VERSION=$(uv tool run semantic-release version --print 2>/dev/null || echo "")
          if [ -z "$NEXT_VERSION" ]; then
            echo "No version bump needed"
            echo "new_version=" >> $GITHUB_OUTPUT
          else
            echo "Next version: $NEXT_VERSION"
            echo "new_version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Build package
        if: steps.version.outputs.new_version != ''
        run: |
          uv build
          ls -la dist/

      - name: Create release (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' && steps.version.outputs.new_version != '' }}
        run: |
          echo "DRY RUN: Would create release v${{ steps.version.outputs.new_version }}"
          echo "Artifacts:"
          ls -la dist/

      - name: Create release
        if: ${{ github.event.inputs.dry_run != 'true' && steps.version.outputs.new_version != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ steps.version.outputs.new_version }}"

          # Create git tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Run semantic-release to update version files and changelog
          uv tool run semantic-release version

          # Push changes and tag
          git push origin main --follow-tags

          # Create GitHub release with artifacts
          gh release create "$VERSION" \
            --title "Release $VERSION" \
            --generate-notes \
            dist/*.whl \
            dist/*.tar.gz

      - name: Upload artifacts
        if: steps.version.outputs.new_version != ''
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ steps.version.outputs.new_version }}
          path: dist/
          retention-days: 90

  # Optional: Upload to private registry (GitHub Packages)
  publish-to-github-packages:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: release
    if: ${{ github.event.inputs.dry_run != 'true' }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Publish to GitHub Packages
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv publish \
            --publish-url https://ghcr.io/v2/${{ github.repository_owner }} \
            dist/*.whl dist/*.tar.gz
        continue-on-error: true  # Don't fail if packages already exist
