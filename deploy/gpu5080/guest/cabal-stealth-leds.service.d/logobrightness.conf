[Service]
# Headless X on VFIO GP102 (BusID PCI:6:0:0) so nvidia-settings can set the
# GeForce logo. Never OpenRGB --server.
ExecStartPost=/bin/bash -c "if ! pgrep -x Xorg >/dev/null; then Xorg :0 -config /etc/X11/xorg-nvidia-headless.conf -nolisten tcp >/var/log/xorg-logo.log 2>&1 & sleep 3; fi; DISPLAY=:0 nvidia-settings -c :0 -a GPULogoBrightness=0 || true; DISPLAY=:0 nvidia-settings -c :0 -a [gpu:0]/GPULogoBrightness=0 || true"
