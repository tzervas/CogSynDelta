# Security scanning workflow for CogSynDelta (Private Repository)
# Includes CodeQL SAST, dependency review, and secret scanning

name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run weekly security scans
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Restrict permissions for security
permissions:
  contents: read
  security-events: write
  actions: read

env:
  UV_VERSION: "0.7.17"

jobs:
  # CodeQL Static Analysis (SAST)
  # NOTE: CodeQL analysis runs successfully but upload requires GitHub Advanced Security (GHAS)
  # For private repos without GHAS, set ENABLE_CODEQL_UPLOAD='false' to skip upload step
  # Analysis results are saved as artifacts when upload is disabled
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only run if code scanning is enabled (set ENABLE_CODEQL=true in repo variables)
    if: ${{ vars.ENABLE_CODEQL == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          # Use extended queries for more thorough analysis
          queries: security-extended,security-and-quality
          # Config for private repo - no code upload
          config: |
            paths-ignore:
              - tests
              - benchmarks
              - examples
              - docs

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
          # Only upload if GHAS is enabled (requires paid GHAS for private repos)
          # Set ENABLE_CODEQL_UPLOAD='true' in repo variables if GHAS is available
          upload: ${{ vars.ENABLE_CODEQL_UPLOAD == 'true' }}
          # Save SARIF results as artifact when upload is disabled
          output: sarif-results

      - name: Upload SARIF as artifact (when GHAS upload disabled)
        if: ${{ vars.ENABLE_CODEQL_UPLOAD != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-results
          path: sarif-results
          retention-days: 30

  # Dependency Review (PR only)
  # Requires GitHub Advanced Security (paid for private repos)
  # Enable at: Settings > Security > Code security and analysis > Dependency graph
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    # Only run on PRs AND when GHAS is enabled (set ENABLE_DEPENDENCY_REVIEW=true)
    if: github.event_name == 'pull_request' && vars.ENABLE_DEPENDENCY_REVIEW == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Fail on high/critical vulnerabilities
          fail-on-severity: high
          # Allow permissive licenses (deny all others by default)
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, PSF-2.0, Unlicense, WTFPL, CC0-1.0, 0BSD

  # Snyk Security Scan (requires SNYK_TOKEN secret)
  snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    # Only run if SNYK_TOKEN is configured
    if: ${{ vars.ENABLE_SNYK == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install 3.14

      - name: Generate requirements for Snyk
        run: |
          uv export --no-hashes > requirements-snyk.txt

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/python@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=requirements-snyk.txt --severity-threshold=high

      - name: Upload Snyk results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: snyk.sarif
        continue-on-error: true

  # Python-specific security checks (always runs)
  python-security:
    name: Python Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install 3.14

      - name: Install security tools
        run: |
          uv tool install bandit
          uv tool install pip-audit

      - name: Run Bandit security linter
        run: |
          # Run bandit for JSON report (always succeeds)
          uv tool run bandit -r src/ -f json -o bandit-report.json || echo "Bandit found issues (see report)"
          # Run bandit for human output (-ll = only medium+, -ii = only medium+ confidence)
          uv tool run bandit -r src/ -ll -ii || echo "::notice::Bandit found potential security issues. Review bandit-report.json artifact."

      - name: Run pip-audit for known vulnerabilities
        run: |
          uv export --no-hashes > requirements-audit.txt
          # pip-audit may fail if packages don't have vulnerability data yet (Python 3.14 beta)
          uv tool run pip-audit -r requirements-audit.txt --desc on || echo "::notice::pip-audit completed with findings or unavailable packages."

      - name: Upload security reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
          retention-days: 30
