# Forgejo-executed security gate. GitHub-only products (CodeQL, Dependency Review,
# Snyk) are a named no-op so they never show as skipped. Artifact upload is gone:
# job containers cannot reach ROOT_URL:443 (ECONNREFUSED 192.168.1.170:443, then
# artifact API 500). The merge gate is bandit -ll -ii printed to the log.
name: Security

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BANDIT_VERSION: "1.8.6"

jobs:
  python-security:
    name: Python Security Checks
    runs-on: [self-hosted, linux, x64, podman]
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Bandit (gate) and pip-audit (notice)
        run: |
          set -euo pipefail
          command -v uv >/dev/null 2>&1 || {
            echo "uv missing — job image is not fleet-ci-base" >&2
            exit 1
          }
          uv --version

          echo "== bandit gate (medium+ / medium+ confidence; this exit code is the job) =="
          if command -v bandit >/dev/null 2>&1; then
            bandit --version
            bandit -r src/ -ll -ii
          else
            uvx --python 3.12 --from "bandit==${BANDIT_VERSION}" bandit -r src/ -ll -ii
          fi

          echo "== pip-audit (notice only; known unfixed pins, not a merge gate) =="
          uv export --python 3.12 --no-hashes --no-sources > requirements-audit.txt
          set +e
          if command -v pip-audit >/dev/null 2>&1; then
            pip-audit -r requirements-audit.txt --desc on
          else
            uv tool run pip-audit -r requirements-audit.txt --desc on
          fi
          audit_st=$?
          set -e
          if [ "$audit_st" -ne 0 ]; then
            echo "NOTICE: pip-audit exited ${audit_st}"
            echo "known unfixed pins: pygments PYSEC-2026-2987, setuptools PYSEC-2026-3447"
            echo "Not a merge gate. Gate is bandit -ll -ii above."
          fi

  github-only:
    name: GitHub-only checks (not run on Forgejo)
    runs-on: [self-hosted, linux, x64, podman]
    timeout-minutes: 2
    steps:
      - name: Not run on Forgejo
        run: |
          echo "CodeQL, Dependency Review, and Snyk are GitHub Advanced Security / SNYK_TOKEN jobs."
          echo "This Forgejo runner does not execute them. python-security is the merge gate."
