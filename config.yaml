# Configuration for PCN-VAE-GAN Hybrid Self-Improving AI

# Exploratory phase parameters
exploratory:
  k: 10  # Number of exploratory samples
  sigma_scale: 1.0  # Configurable σ scale for VAE sampling
  latent_dim: 20  # Latent dimension for VAE
  hidden_dim: 400  # Hidden layer dimension

# Culling phase parameters
culling:
  threshold: 0.5  # Threshold for culling decisions
  bidirectional_beam_width: 5  # Beam width for bidirectional A*
  bayesian_prior_weight: 0.1  # Weight for log prior in Bayesian inference

# Meta-optimization parameters
meta_optimization:
  inner_lr: 0.01  # Inner loop learning rate for MAML
  meta_lr: 0.001  # Meta learning rate
  num_inner_steps: 5  # Number of inner gradient steps
  
# Training parameters
training:
  batch_size: 128
  epochs: 10
  learning_rate: 0.001
  
# VAE loss parameters
vae_loss:
  reconstruction_weight: 1.0  # Weight for reconstruction loss
  kl_weight: 1.0  # Weight for KL divergence
