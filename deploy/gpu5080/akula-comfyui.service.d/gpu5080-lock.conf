# Wrap akula-comfyui so the 5080 is never free-running CUDA.
# HTTP stays on 192.168.1.251:8188. GPU Comfy starts only after
# /home/tzervas/akula-harness/scripts/gpu5080-lock (same helper as
# CUDA CI / gpu-5080.yml LOCK=). Idle release is finish-then-free.
# Wrapping the whole quadlet ExecStart would hold the flock for the
# unit lifetime and starve autodev — this drop-in is the queue hook.
#
# Never 0.0.0.0 WAN. Never .252. Do not mask to schedule.

[Service]
Type=simple
NotifyAccess=main
TimeoutStartSec=90
TimeoutStopSec=180
# If autodev holds the lock, this unit stays active (idle HTTP) and
# waits on first prompt instead of failing systemd start.
Restart=on-failure
RestartSec=5
Environment=GPU5080_LOCK_HELPER=/home/tzervas/akula-harness/scripts/gpu5080-lock
Environment=GPU5080_LOCK_WAIT=3600
Environment=COMFY_LAN_BIND=192.168.1.251
Environment=COMFY_LAN_PORT=8188
Environment=COMFY_GPU_BIND=127.0.0.1
Environment=COMFY_GPU_PORT=8189
Environment=COMFY_IDLE_SEC=90
ExecStart=
ExecStart=/home/tzervas/akula-harness/scripts/akula-comfyui-locked
