# Documentation Generation Workflow
# Auto-generates API documentation using pdoc and deploys to GitHub Pages

name: Documentation

# Manual only — no push/pull_request CI triggers
on:
  push:
    branches:
      - main
      - dev
      - develop
  pull_request:
    branches:
      - main
      - dev
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  UV_VERSION: "0.7.17"

jobs:
  build:
    name: Build Documentation
    runs-on: [self-hosted, linux, x64, podman]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: |
          uv sync --group dev --group docs

      - name: Install pdoc
        run: uv tool install pdoc

      - name: Generate API documentation
        run: |
          mkdir -p _site/api

          # Generate API docs with pdoc
          uv tool run pdoc \
            --docformat google \
            --output-directory _site/api \
            src/cogsyndelta

      - name: Copy manual documentation
        run: |
          # Copy markdown docs
          cp -r docs/* _site/ 2>/dev/null || true
          cp README.md _site/
          cp CHANGELOG.md _site/
          cp ROADMAP.md _site/
          cp AGENTS.md _site/

          # Create index page
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>CogSynDelta Documentation</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
              h1 { border-bottom: 2px solid #333; padding-bottom: 10px; }
              ul { list-style-type: none; padding: 0; }
              li { margin: 10px 0; }
              a { color: #0066cc; text-decoration: none; }
              a:hover { text-decoration: underline; }
              .section { margin: 30px 0; }
            </style>
          </head>
          <body>
            <h1>🧠 CogSynDelta Documentation</h1>
            <p>PCN-VAE-GAN Hybrid Self-Improving AI System</p>

            <div class="section">
              <h2>📚 Guides</h2>
              <ul>
                <li><a href="README.html">README - Getting Started</a></li>
                <li><a href="INSTALL.html">Installation Guide</a></li>
                <li><a href="ROADMAP.html">Project Roadmap</a></li>
                <li><a href="CHANGELOG.html">Changelog</a></li>
              </ul>
            </div>

            <div class="section">
              <h2>🔧 Development</h2>
              <ul>
                <li><a href="CONTRIBUTING.html">Contributing Guide</a></li>
                <li><a href="DEVELOPMENT_STANDARDS.html">Development Standards</a></li>
                <li><a href="AGENTS.html">AI Agent Guidelines</a></li>
                <li><a href="BRANCHING_STRATEGY.html">Branching Strategy</a></li>
              </ul>
            </div>

            <div class="section">
              <h2>🏗️ Architecture</h2>
              <ul>
                <li><a href="ARCHITECTURE.html">System Architecture</a></li>
                <li><a href="adr/">Architecture Decision Records</a></li>
                <li><a href="API_REFERENCE.html">API Reference (Manual)</a></li>
              </ul>
            </div>

            <div class="section">
              <h2>📖 API Documentation</h2>
              <ul>
                <li><a href="api/cogsyndelta.html">cogsyndelta (auto-generated)</a></li>
              </ul>
            </div>
          </body>
          </html>
          EOF

      - name: Convert Markdown to HTML
        run: |
          uv tool install markdown

          for md in _site/*.md; do
            if [ -f "$md" ]; then
              html="${md%.md}.html"
              echo "Converting $md to $html"
              uv tool run python -m markdown "$md" > "$html" || true
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: [self-hosted, linux, x64, podman]
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
