# Homelab OTel collector (contrib 0.159.0). LAN OTLP only.
# security-net aliases: victoria-metrics 172.30.0.12, loki 172.30.0.10, jaeger 172.30.0.15.
# Collector itself is 172.30.0.14 (akula-otel). Do not reuse .10 .12 .13.
# PublishPort on the quadlet is 192.168.1.170 — never 0.0.0.0 WAN.
# Traces stay Jaeger Apache-2.0. Never Tempo.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 80
  batch:
    timeout: 5s
    send_batch_size: 1024
  resource:
    attributes:
      - key: deployment.environment
        value: homelab
        action: upsert
      - key: service.namespace
        value: akula
        action: upsert
      - key: cluster
        value: vectorweight
        action: upsert
      # Taxonomy process tags. insert = sender may override (prime/gpu5080).
      - key: host
        value: homelab
        action: insert
      - key: env
        value: prod-intent
        action: insert
      - key: ns
        value: o11y
        action: insert
  transform/taxonomy:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - set(resource.attributes["service.name"], "akula-localai") where resource.attributes["service.name"] == "localai"
          - set(resource.attributes["service.name"], "akula-comfyui.service") where resource.attributes["service.name"] == "comfy"
          - set(resource.attributes["service.name"], "akula-jaeger") where resource.attributes["service.name"] == "jaeger"
          - set(resource.attributes["host"], "prime") where resource.attributes["host"] == "akula-prime"

exporters:
  prometheusremotewrite:
    endpoint: http://victoria-metrics:8428/api/v1/write
    tls:
      insecure: true
    resource_to_telemetry_conversion:
      enabled: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  file:
    path: /var/lib/otel/traces.jsonl
    format: json
    create_directory: true
    rotation:
      max_megabytes: 100
      max_backups: 5

service:
  telemetry:
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, transform/taxonomy, batch]
      exporters: [otlp/jaeger, file]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheusremotewrite]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/loki]
