# Guest quadlet drop-in. Do not copy onto gpu5080 host /etc/containers/systemd/.
# RAG CUDA starts after stealth oneshot so the Pascal driver cannot leave
# the GeForce logo lit. Never OpenRGB --server. Never nvidia.com/gpu=all.
[Unit]
After=cabal-stealth-leds.service nvidia-persistenced.service
Wants=cabal-stealth-leds.service
