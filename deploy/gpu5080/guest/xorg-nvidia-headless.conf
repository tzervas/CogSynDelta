Section "ServerLayout"
    Identifier "Layout0"
    Screen 0 "Screen0"
EndSection
Section "Device"
    Identifier "NVIDIA0"
    Driver "nvidia"
    BusID "PCI:6:0:0"
    Option "AllowEmptyInitialConfiguration" "true"
    Option "UseDisplayDevice" "none"
    Option "ConnectedMonitor" "DFP-0"
    Option "ProbeAllGpus" "false"
EndSection
Section "Screen"
    Identifier "Screen0"
    Device "NVIDIA0"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Virtual 640 480
    EndSubSection
EndSection
