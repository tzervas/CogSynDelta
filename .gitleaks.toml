title = "CogSynDelta gitleaks config"

[extend]
# Keep every default rule; we only add one narrow allowlist entry below.
useDefault = true

# fleet-security / gitleaks runs `gitleaks detect --source . --verbose --redact`
# (.github/workflows/fleet-security.yml) with no --no-git flag, i.e. full
# git-history mode: every commit ever reachable from HEAD is scanned every
# run, forever. That makes a per-commit fix-forward ineffective for this
# false positive, and a .gitleaksignore fingerprint entry unstable for it:
#
#   - The underlying secret-shaped text is a tokenizer-load log line,
#     committed verbatim as byte-for-byte experiment evidence in
#     docs/design/evidence/w1-token-rank-2026-09-02/results.json:350 and
#     w1d-readout-probe-2026-09-02/results.json:590 (PR #5, introduced at
#     commit 27b0e4d). .gitleaksignore already carries fingerprint entries
#     for those two, scoped to 27b0e4d.
#   - .gitleaksignore itself is a committed, git-history-scanned file. An
#     earlier commit (6f8ff7b) quoted that same log line verbatim in a
#     documentation comment, which made the "generic-api-key" rule match
#     .gitleaksignore's own historical content (commit 6f8ff7b, lines 19
#     and 22). That commit is immutable -- rewriting it is out of scope --
#     so no fingerprint entry keyed to the *current* file state can ever
#     suppress a match against that specific past blob, and a fingerprint
#     entry keyed to 6f8ff7b would itself be displaced the next time this
#     file's line numbers shift, reopening the same failure.
#
# The allowlist below matches only the byte-identical substring under only
# the one rule it false-positives on, so it cannot mask an unrelated
# secret, and it covers the finding regardless of which commit or file it
# is quoted in -- including .gitleaksignore's own history.
[[allowlists]]
description = "generic-api-key false positive: tokenizer-load log line (evidence files + quoted in .gitleaksignore's own history at 6f8ff7b)"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = [
  '''gpt2_tokenizer\.json, vocab_size=50257''',
]
