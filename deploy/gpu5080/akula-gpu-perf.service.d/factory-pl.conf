# Factory clocks / default PL only. Do not lock clocks or raise PL to max.
[Service]
ExecStart=
ExecStart=/usr/bin/nvidia-smi -pm 1
ExecStart=/bin/sh -c "def=$(nvidia-smi --query-gpu=power.default_limit --format=csv,noheader,nounits | awk \"{print \$1}\"); nvidia-smi -pl \"$def\""
ExecStart=/bin/sh -c "for g in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do echo performance > \"$g\"; done"
