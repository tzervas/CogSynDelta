# Fleet standard CI — self-hosted. Honest status: pytest failure fails the job.
# cancel-in-progress: false — rapid pushes were killing 13m+ in-flight work.
# Work rootfs: fleet gha-work image (ap-fleet-work-images) via host GHA_IMAGE.
# runs-on labels match fleet agent defaults.
name: fleet-ci

on:
  push:
    branches: [main, master, dev, develop]
  pull_request:
    branches: [main, master, dev, develop]
  workflow_dispatch:

concurrency:
  group: fleet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  detect:
    name: detect stack
    runs-on: [self-hosted, linux, x64, podman]
    outputs:
      rust: ${{ steps.d.outputs.rust }}
      python: ${{ steps.d.outputs.python }}
    steps:
      - uses: actions/checkout@v7
      - id: d
        run: |
          set -euo pipefail
          rust=false; python=false
          if [ -f Cargo.toml ]; then rust=true; fi
          if [ -f pyproject.toml ] || [ -f requirements.txt ] || [ -f setup.py ]; then python=true; fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "python=$python" >> "$GITHUB_OUTPUT"

  rust:
    name: cargo check/test
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: [self-hosted, linux, x64, podman]
    steps:
      - uses: actions/checkout@v7
      - name: cargo check
        run: cargo check --workspace --all-targets
      - name: cargo test
        run: cargo test --workspace

  python:
    name: python lint/test
    needs: detect
    # PRs to main already run poc-ci + CI Test. Don't take a second torch sync.
    if: needs.detect.outputs.python == 'true' && github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, podman]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        run: |
          # setup-uv@v7 as mirrored on data.forgejo.org fails to unpack uv
          # ("tar failed with exit code 2") from both its mirror and the GitHub
          # fallback, so uv never lands on PATH. The installer is one call to a
          # host CI already reaches, and honours the same UV_VERSION pin.
          VER="${{ env.UV_VERSION }}"
          if [ -n "$VER" ]; then
            curl -LsSf "https://astral.sh/uv/${VER}/install.sh" | sh
          else
            curl -LsSf https://astral.sh/uv/install.sh | sh
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Sync (CPU torch)
        run: |
          set -euo pipefail
          # Keep within requires-python (>=3.12,<3.14)
          uv python install 3.12 || true
          if [ -f uv.lock ] || [ -f pyproject.toml ]; then
            uv sync --group dev --no-sources --no-compile-bytecode --link-mode copy \
              --extra-index-url https://download.pytorch.org/whl/cpu \
              --index-strategy unsafe-best-match || uv sync --group dev --no-compile-bytecode --link-mode copy
          fi
      - name: Ruff (poc surface)
        run: |
          set -euo pipefail
          uv run --no-sync ruff check src/cogsyndelta/contracts src/cogsyndelta/poc \
            tests/test_poc_contracts.py tests/test_poc_train.py \
            tests/test_poc_compress.py tests/test_poc_registry.py
      - name: Pytest PoC (must fail job on failure)
        run: |
          set -euo pipefail
          uv run --no-sync pytest tests/test_poc_contracts.py tests/test_poc_train.py \
            tests/test_poc_compress.py tests/test_poc_registry.py -q --tb=short

  noop:
    name: no stack detected
    needs: detect
    if: needs.detect.outputs.rust != 'true' && needs.detect.outputs.python != 'true'
    runs-on: [self-hosted, linux, x64, podman]
    steps:
      - run: |
          echo "No stack detected."
          exit 1
