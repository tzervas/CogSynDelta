# GPU Benchmark workflow for CogSynDelta (Private Repository)
# Manual trigger for uploading GPU benchmark results from akula-prime
# Results are stored as artifacts for persistence

name: GPU Benchmarks

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      benchmark_json:
        description: 'Benchmark JSON file content (base64 encoded)'
        required: false
        type: string
      benchmark_text:
        description: 'Benchmark text file content (base64 encoded)'
        required: false
        type: string
      gpu_name:
        description: 'GPU name (e.g., RTX 5080)'
        required: true
        type: string
        default: 'RTX 5080'
      run_date:
        description: 'Benchmark run date (YYYY-MM-DD)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: gpu-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  upload-results:
    name: Upload Benchmark Results
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, podman]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create results directory
        run: mkdir -p benchmark_results

      - name: Decode and save benchmark files
        run: |
          TIMESTAMP="${{ inputs.run_date }}_manual"

          # If JSON provided, decode it
          if [ -n "${{ inputs.benchmark_json }}" ]; then
            echo "${{ inputs.benchmark_json }}" | base64 -d > benchmark_results/gpu_benchmark_${TIMESTAMP}.json
          fi

          # If text provided, decode it
          if [ -n "${{ inputs.benchmark_text }}" ]; then
            echo "${{ inputs.benchmark_text }}" | base64 -d > benchmark_results/gpu_benchmark_${TIMESTAMP}.txt
          fi

          # Create badge JSON
          cat > benchmark_results/benchmark_badge.json << EOF
          {
            "schemaVersion": 1,
            "label": "GPU Benchmark",
            "message": "${{ inputs.gpu_name }} | ${{ inputs.run_date }}",
            "color": "brightgreen",
            "namedLogo": "nvidia",
            "logoColor": "white"
          }
          EOF

          # Create latest symlink data
          echo "gpu_benchmark_${TIMESTAMP}.json" > benchmark_results/latest_ref.txt

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v6
        with:
          name: gpu-benchmark-${{ inputs.run_date }}
          path: benchmark_results/
          retention-days: 365

      - name: Update benchmark results in repo
        if: ${{ inputs.benchmark_json != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add benchmark results
          git add benchmark_results/

          # Commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: Update GPU benchmark results (${{ inputs.run_date }})"
            git push
          fi

  # akula-prime GPU runner labels are self-hosted,linux,x64,gpu,akula-prime.
  # Do NOT add `podman` — GitHub matches supersets, so a GPU runner with
  # `podman` would steal homelab CPU jobs.
  gpu-runner-smoke:
    name: GPU runner smoke (akula-prime)
    runs-on: [self-hosted, linux, x64, gpu, akula-prime]
    timeout-minutes: 10
    steps:
      - name: Verify NVIDIA GPU via CDI
        run: |
          set -euo pipefail
          nvidia-smi -L
          nvidia-smi --query-gpu=name,driver_version,memory.total,memory.used --format=csv
          test -c /dev/nvidia0
          echo "CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-unset}"

  # Same commands as local `scripts/ci_local.sh --poc --cuda`. Keep CUDA
  # [tool.uv.sources] (do not pass --no-sources). No UV_COMPILE_BYTECODE env.
  gpu-poc-cuda:
    name: PoC CUDA tests (akula-prime)
    runs-on: [self-hosted, linux, x64, gpu, akula-prime]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.7.17"
          enable-cache: true

      - name: Python + CUDA torch
        run: |
          set -euo pipefail
          uv python install 3.12
          uv sync --group dev --no-compile-bytecode --link-mode copy

      - name: Assert CUDA
        run: |
          set -euo pipefail
          nvidia-smi -L
          uv run --no-sync python - <<'PY'
          import torch
          assert torch.cuda.is_available(), "torch.cuda.is_available() is False"
          print(f"torch {torch.__version__} device {torch.cuda.get_device_name(0)}")
          PY

      - name: Pytest PoC CUDA
        run: uv run --no-sync pytest tests/test_poc_cuda.py -q --tb=short

      - name: CLI smoke CUDA
        run: |
          set -euo pipefail
          uv run --no-sync python -m cogsyndelta.poc.cli train --device cuda --steps 10 --checkpoint /tmp/poc_vae_cuda.pt
          uv run --no-sync python -m cogsyndelta.poc.cli compress --device cuda --batch 4
          uv run --no-sync python -m cogsyndelta.poc.cli route --device cuda --batch 8
          uv run --no-sync python -m cogsyndelta.poc.cli train-route --device cuda --steps 10
